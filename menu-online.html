<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — FasterFood</title>
  <style>
    :root {
      --bg: #f6f1ec;
      --card: #ffffff;
      --ink: #1c1917;
      --soft: #6b635d;
      --line: #ece4dc;
      --brand: #b91c1c;
      --brand2: #7f1d1d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #dc2626, #b91c1c 55%, #7f1d1d); color: #fff; padding: 22px 16px 18px; text-align: center; }
    header h1 { font-size: 22px; letter-spacing: .02em; }
    header p { font-size: 12.5px; opacity: .85; margin-top: 4px; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .cat { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 14px; -webkit-overflow-scrolling: touch; }
    .cat button { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--ink); }
    .cat button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; gap: 14px; }
    .card img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; background: #f1e9e1; }
    .card .no-img { width: 76px; height: 76px; border-radius: 12px; background: linear-gradient(135deg, #dc2626, #7f1d1d); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; flex: 0 0 auto; }
    .card h3 { font-size: 15px; }
    .card .price { color: var(--brand); font-weight: 800; margin-top: 6px; font-size: 14px; }
    .card .desc { color: var(--soft); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    .card .mods { margin-top: 8px; font-size: 11.5px; color: var(--soft); }
    .card .mods strong { color: var(--ink); }
    .empty { text-align: center; color: var(--soft); padding: 40px 16px; }
    .state { text-align: center; color: var(--soft); padding: 60px 20px; }
    .state .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1 id="shop-name">FasterFood</h1>
    <p id="shop-sub">Order from our menu</p>
  </header>
  <main>
    <div id="cats" class="cat"></div>
    <div id="items"></div>
    <div id="state" class="state"><div class="spin"></div><p style="margin-top:12px">Loading menu…</p></div>
  </main>
  <script>
    async function loadMenu() {
      try {
        const [menuRes, settingsRes] = await Promise.all([
          fetch('/api/data/menu'),
          fetch('/api/data/settings')
        ]);
        const menuData = await menuRes.json();
        const settingsData = await settingsRes.json();
        const menu = (menuData.value || []).slice().sort((a, b) => a.category.localeCompare(b.category));
        const settings = settingsData.value || {};
        document.getElementById('shop-name').textContent = settings.shopName || 'FasterFood';
        document.getElementById('shop-sub').textContent = settings.address || 'Order from our menu';
        document.title = 'Menu — ' + (settings.shopName || 'FasterFood');
        render(menu);
      } catch (error) {
        document.getElementById('state').innerHTML = '<p style="font-size:15px;font-weight:700">Menu unavailable</p><p style="margin-top:8px;font-size:12.5px">Make sure the POS server is running, then refresh.</p>';
      }
    }

    function fmt(value) {
      return (Number(value) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function render(menu) {
      const cats = ['All', ...new Set(menu.map((item) => item.category).filter(Boolean))];
      const catsEl = document.getElementById('cats');
      catsEl.innerHTML = cats.map((cat, i) => `<button class="${i === 0 ? 'active' : ''}" data-cat="${cat}">${cat}</button>`).join('');
      catsEl.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          catsEl.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          showItems(menu, btn.dataset.cat === 'All' ? '' : btn.dataset.cat);
        });
      });
      document.getElementById('state').style.display = 'none';
      showItems(menu, '');
    }

    function showItems(menu, cat) {
      const list = menu.filter((item) => !cat || item.category === cat);
      const el = document.getElementById('items');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No items in this category.</div>';
        return;
      }
      el.innerHTML = list.map((item) => {
        const mods = (item.modifiers || []).map((group) =>
          group.options.map((option) => option.label + (option.price ? ' +' + fmt(option.price) : '')).join(', ')
        ).join(' · ');
        return `<div class="card">
          ${item.image ? `<img src="${item.image}" alt="${item.name}" />` : `<div class="no-img">${item.name.charAt(0).toUpperCase()}</div>`}
          <div style="flex:1">
            <h3>${item.name}</h3>
            <div class="price">₦${fmt(item.price)}</div>
            ${mods ? `<div class="mods"><strong>Add-ons:</strong> ${mods}</div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    loadMenu();
  </script>
</body>
</html>
